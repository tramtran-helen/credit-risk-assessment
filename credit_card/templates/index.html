<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Credit Risk Assessment</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <style>
    body {
      background-color: rgb(34, 34, 114);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card-container {
      max-width: 950px;
      margin: 40px auto;
      padding: 30px;
      background-color: rgb(253, 250, 250);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 30px;
      color: rgb(34, 34, 114);
    }

    h2.section-title {
      font-size: 1.3rem;
      margin-top: 30px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgb(34, 34, 114);
      color: rgb(34, 34, 114);
      font-weight: bold;
    }

    .form-group label {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem; 
      font-weight: 500;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 25px;
      background-color: rgb(34, 34, 114);
      border-color: rgb(34, 34, 114);
    }

    .alert {
      margin-top: 30px;
      font-size: 1.1rem;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #6c757d;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="container card-container">
    <h1>Credit Risk Assessment</h1>
    <form method="POST" action="/">
      <h2 class="section-title">Basic Information</h2>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="limit_bal">Credit Limit (NT$)</label>
          <input type="number" class="form-control" id="limit_bal" name="limit_bal" value="50000" required />
        </div>
        <div class="form-group col-md-4">
          <label for="age">Age</label>
          <input type="number" class="form-control" id="age" name="age" value="30" required />
        </div>
        <div class="form-group col-md-4">
          <label for="sex">Gender</label>
          <select class="form-control" id="sex" name="sex">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="education">Education</label>
          <select class="form-control" id="education" name="education">
            <option value="Graduate School">Graduate School</option>
            <option value="University">University</option>
            <option value="High School">High School</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="form-group col-md-6">
          <label for="marriage">Marital Status</label>
          <select class="form-control" id="marriage" name="marriage">
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Others">Others</option>
          </select>
        </div>
      </div>

      <h2 class="section-title">Payment Status</h2>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="pay_status_sept">Payment Status for September</label>
          <input type="number" class="form-control" id="pay_status_sept" name="pay_status_sept" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_status_aug">Payment Status for August</label>
          <input type="number" class="form-control" id="pay_status_aug" name="pay_status_aug" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_status_jul">Payment Status for July</label>
          <input type="number" class="form-control" id="pay_status_jul" name="pay_status_jul" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_status_jun">Payment Status for June</label>
          <input type="number" class="form-control" id="pay_status_jun" name="pay_status_jun" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_status_may">Payment Status for May</label>
          <input type="number" class="form-control" id="pay_status_may" name="pay_status_may" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_status_apr">Payment Status for April</label>
          <input type="number" class="form-control" id="pay_status_apr" name="pay_status_apr" value="0" />
        </div>
      </div>

      <h2 class="section-title">Bill Statements</h2>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="bill_amt_sept">Bill Statement for September</label>
          <input type="number" class="form-control" id="bill_amt_sept" name="bill_amt_sept" value="5000" />
        </div>
        <div class="form-group col-md-4">
          <label for="bill_amt_aug">Bill Statement for August</label>
          <input type="number" class="form-control" id="bill_amt_aug" name="bill_amt_aug" value="5000" />
        </div>
        <div class="form-group col-md-4">
          <label for="bill_amt_jul">Bill Statement for July</label>
          <input type="number" class="form-control" id="bill_amt_jul" name="bill_amt_jul" value="5000" />
        </div>
        <div class="form-group col-md-4">
          <label for="bill_amt_jun">Bill Statement for June</label>
          <input type="number" class="form-control" id="bill_amt_jun" name="bill_amt_jun" value="5000" />
        </div>
        <div class="form-group col-md-4">
          <label for="bill_amt_may">Bill Statement for May</label>
          <input type="number" class="form-control" id="bill_amt_may" name="bill_amt_may" value="5000" />
        </div>
        <div class="form-group col-md-4">
          <label for="bill_amt_apr">Bill Statement for April</label>
          <input type="number" class="form-control" id="bill_amt_apr" name="bill_amt_apr" value="5000" />
        </div>
      </div>

      <h2 class="section-title">Previous Payments</h2>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="pay_amt_sept">Previous Payment for September</label>
          <input type="number" class="form-control" id="pay_amt_sept" name="pay_amt_sept" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_amt_aug">Previous Payment for August</label>
          <input type="number" class="form-control" id="pay_amt_aug" name="pay_amt_aug" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_amt_jul">Previous Payment for July</label>
          <input type="number" class="form-control" id="pay_amt_jul" name="pay_amt_jul" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_amt_jun">Previous Payment for June</label>
          <input type="number" class="form-control" id="pay_amt_jun" name="pay_amt_jun" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_amt_may">Previous Payment for May</label>
          <input type="number" class="form-control" id="pay_amt_may" name="pay_amt_may" value="0" />
        </div>
        <div class="form-group col-md-4">
          <label for="pay_amt_apr">Previous Payment for April</label>
          <input type="number" class="form-control" id="pay_amt_apr" name="pay_amt_apr" value="0" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Predict</button>

      {% if prediction %}
      <div class="alert alert-info">{{ prediction }}</div>
      {% endif %}
    </form>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
